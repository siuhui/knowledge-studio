services:
  # ── PostgreSQL 16 + pgvector ──
  db:
    image: pgvector/pgvector:pg16
    container_name: ks-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-knowledge_studio}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-knowledge_studio}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── MinIO (S3-compatible object storage) ──
  minio:
    image: minio/minio:latest
    container_name: ks-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── FastAPI 后端 ──
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: ks-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - ../apps/api/.env
    ports:
      - "${API_PORT:-8000}:8000"

  # ── Next.js 前端 ──
  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: ks-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
  minio_data: